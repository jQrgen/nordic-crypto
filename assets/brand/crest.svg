<title id="title">Nordic Crypto</title>
<desc id="desc">Heraldic crest of Nordic Crypto: a gold heater shield charged with a dark-red eight-petal rosette, a black raven crest, gold and dark-red mantling, a crowned axe-lion and a second lion as supporters, a seated polar bear, and a silver scroll reading NORDIC CRYPTO.</desc>
