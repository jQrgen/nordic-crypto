# Nordic Crypto stories and events (Cloudflare Workers + D1).
# Deploy steps are in README.md. Do not put secrets in this file.
# The database id below is the nordic-crypto-content D1 database.
# Secrets (wrangler secret put, never committed):
#   EDITOR_TOKEN            editor review API
#   GITHUB_DISPATCH_TOKEN   optional; starts the d1-publish workflow after an approval
name = "nordic-crypto-content"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false
# Public read API for the site and the apps: https://api.nordiccrypto.no/api/v1/news.json
# (approved, published stories from D1; 60 s edge cache). Needs the nordiccrypto.no zone on this account.
routes = [{ pattern = "api.nordiccrypto.no", custom_domain = true }]

[observability]
enabled = false

[vars]
GITHUB_REPOSITORY = "nordic-crypto-org/nordic-crypto"

[[d1_databases]]
binding = "DB"
database_name = "nordic-crypto-content"
database_id = "ebba20cc-77a8-4d50-a753-dd46fcb8798d"
migrations_dir = "migrations"

