openapi: 3.0.3
info:
  title: Nordic Crypto data API
  version: "1"
  description: "Public read-only JSON for Nordic Crypto (https://nordiccrypto.no/). No authentication. News, newsletters, events, sources, academia, the who's who, profiles, images, the rules map, the changelog, the article archive, public talk videos and Nordic exchange prices (market data, not investment advice). Kaupr is a news source only, never a sponsor. The sign-off is The Nordic Crypto team. GitHub Pages sends Access-Control-Allow-Origin: * so browsers can fetch these files. English text is the default; published translations are inside each object under *_i18n. Site languages: /api/v1/languages.json. IP-country language guess: /api/v1/geo-language.json (the nc_lang cookie wins). Discovery: https://nordiccrypto.no/api/v1/index.json. Human docs: https://nordiccrypto.no/api/."
  license:
    name: MIT
    url: "https://github.com/jQrgen/nordic-crypto/blob/main/LICENSE"
  contact:
    name: Nordic Crypto
    url: "https://nordiccrypto.no/about/"
servers:
  - url: "https://nordiccrypto.no"
    description: Public site
paths:
  "/api/v1/index.json":
    get:
      operationId: index
      summary: "Discovery document: every endpoint, with example URLs."
      responses:
        "200":
          description: "Discovery document: every endpoint, with example URLs."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Discovery"
  "/api/v1/news.json":
    get:
      operationId: api_v1_news
      summary: "Published news and our own stories, newest first."
      responses:
        "200":
          description: "Published news and our own stories, newest first."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/NewsList"
  "/api/v1/news/{id}.json":
    get:
      operationId: api_v1_news_item
      summary: One item from /api/v1/news.json
      responses:
        "200":
          description: One item from /api/v1/news.json
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Document"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  "/api/v1/news/by-country/{country}.json":
    get:
      operationId: news_by_country
      summary: "Published news for one country code: NO, SE, DK, FI, IS, NORDIC or EU."
      responses:
        "200":
          description: "Published news for one country code: NO, SE, DK, FI, IS, NORDIC or EU."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/NewsList"
      parameters:
        - name: country
          in: path
          required: true
          schema:
            type: string
            enum:
              - "NO"
              - SE
              - DK
              - FI
              - IS
              - NORDIC
              - EU
  "/api/v1/news/topics.json":
    get:
      operationId: api_v1_news_topics
      summary: "Topic ids present in the published news, with counts."
      responses:
        "200":
          description: "Topic ids present in the published news, with counts."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TopicIndex"
  "/api/v1/news/by-topic/{topic}.json":
    get:
      operationId: api_v1_news_topics_item
      summary: One item from /api/v1/news/topics.json
      responses:
        "200":
          description: One item from /api/v1/news/topics.json
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Document"
      parameters:
        - name: topic
          in: path
          required: true
          schema:
            type: string
  "/api/v1/newsletters.json":
    get:
      operationId: api_v1_newsletters
      summary: "Published newsletter issues, newest first. The list omits the HTML body; the issue URL includes text and html."
      responses:
        "200":
          description: "Published newsletter issues, newest first. The list omits the HTML body; the issue URL includes text and html."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/NewsletterList"
  "/api/v1/newsletters/{id}.json":
    get:
      operationId: api_v1_newsletters_item
      summary: One item from /api/v1/newsletters.json
      responses:
        "200":
          description: One item from /api/v1/newsletters.json
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Document"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  "/api/v1/events.json":
    get:
      operationId: api_v1_events
      summary: "Public events, soonest start first, including past events."
      responses:
        "200":
          description: "Public events, soonest start first, including past events."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EventList"
  "/api/v1/events/{id}.json":
    get:
      operationId: api_v1_events_item
      summary: One item from /api/v1/events.json
      responses:
        "200":
          description: One item from /api/v1/events.json
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Document"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  "/api/v1/events/upcoming.json":
    get:
      operationId: api_v1_events_upcoming
      summary: "Events that have not ended, soonest first. Judged in the event's own offset."
      responses:
        "200":
          description: "Events that have not ended, soonest first. Judged in the event's own offset."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EventList"
  "/api/v1/events/past.json":
    get:
      operationId: api_v1_events_past
      summary: "Finished public events, newest first. Finished events stay in the archive."
      responses:
        "200":
          description: "Finished public events, newest first. Finished events stay in the archive."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EventList"
  "/api/v1/events/previous.json":
    get:
      operationId: api_v1_events_previous
      summary: "Previous events, newest finish first. Finished calendar events plus backfilled public events (source backfill). Backfill is not on the calendar or in upcoming or past."
      responses:
        "200":
          description: "Previous events, newest finish first. Finished calendar events plus backfilled public events (source backfill). Backfill is not on the calendar or in upcoming or past."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EventList"
  "/api/v1/events/by-country/{country}.json":
    get:
      operationId: events_by_country
      summary: Public events for one country code.
      responses:
        "200":
          description: Public events for one country code.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EventList"
      parameters:
        - name: country
          in: path
          required: true
          schema:
            type: string
            enum:
              - "NO"
              - SE
              - DK
              - FI
              - IS
              - NORDIC
              - EU
  "/api/v1/talks.json":
    get:
      operationId: api_v1_talks
      summary: "Public talks on bitcoin, cryptocurrencies and blockchain in the Nordic countries, newest first. A player is embedded on the site only when embed is true (YouTube via youtube-nocookie.com, or the Vimeo player). Unknown fields are null. description is ours; title and the other details come from the platform."
      responses:
        "200":
          description: "Public talks on bitcoin, cryptocurrencies and blockchain in the Nordic countries, newest first. A player is embedded on the site only when embed is true (YouTube via youtube-nocookie.com, or the Vimeo player). Unknown fields are null. description is ours; title and the other details come from the platform."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TalkList"
  "/api/v1/talks/{id}.json":
    get:
      operationId: api_v1_talks_item
      summary: One item from /api/v1/talks.json
      responses:
        "200":
          description: One item from /api/v1/talks.json
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Document"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  "/api/v1/talks/by-country/{country}.json":
    get:
      operationId: talks_by_country
      summary: "Public talks for one country code: NO, SE, DK, FI, IS, FO (Faroe Islands), GL (Greenland) or AX (Åland)."
      responses:
        "200":
          description: "Public talks for one country code: NO, SE, DK, FI, IS, FO (Faroe Islands), GL (Greenland) or AX (Åland)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TalkList"
      parameters:
        - name: country
          in: path
          required: true
          schema:
            type: string
            enum:
              - "NO"
              - SE
              - DK
              - FI
              - IS
              - FO
              - GL
              - AX
  "/api/v1/sources.json":
    get:
      operationId: api_v1_sources
      summary: "News outlets, justice-system press pages, the public search terms, and event sources. coverage is national, regional, local or justice. region is the place. feed is null when no working RSS, sitemap or index page was verified. method is rss, html, sitemap, search or manual. Event sources name the intake method. Luma calendars use a public iCal subscribe URL. Eventbrite organizers and venues use the v3 API when the server has EVENTBRITE_TOKEN; the token is not in this feed. Without it, event pages are schema.org JSON-LD. icon_url is a public icon from the outlet when one was easy to find. logo_source is the URL the stored logo was fetched from. logo is the checked outlet image for that source id when one is on file, used only to identify the source. Kaupr is marked as a news source only and is never an event sponsor."
      responses:
        "200":
          description: "News outlets, justice-system press pages, the public search terms, and event sources. coverage is national, regional, local or justice. region is the place. feed is null when no working RSS, sitemap or index page was verified. method is rss, html, sitemap, search or manual. Event sources name the intake method. Luma calendars use a public iCal subscribe URL. Eventbrite organizers and venues use the v3 API when the server has EVENTBRITE_TOKEN; the token is not in this feed. Without it, event pages are schema.org JSON-LD. icon_url is a public icon from the outlet when one was easy to find. logo_source is the URL the stored logo was fetched from. logo is the checked outlet image for that source id when one is on file, used only to identify the source. Kaupr is marked as a news source only and is never an event sponsor."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SourceCatalogue"
  "/api/v1/academia.json":
    get:
      operationId: api_v1_academia
      summary: "Editor-approved courses, student groups, publications and research."
      responses:
        "200":
          description: "Editor-approved courses, student groups, publications and research."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Academia"
  "/api/v1/academia/courses.json":
    get:
      operationId: api_v1_academia_courses
      summary: "Academia section: courses."
      responses:
        "200":
          description: "Academia section: courses."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AcademiaSection"
  "/api/v1/academia/groups.json":
    get:
      operationId: api_v1_academia_groups
      summary: "Academia section: groups."
      responses:
        "200":
          description: "Academia section: groups."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AcademiaSection"
  "/api/v1/academia/publications.json":
    get:
      operationId: api_v1_academia_publications
      summary: "Academia section: publications."
      responses:
        "200":
          description: "Academia section: publications."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AcademiaSection"
  "/api/v1/academia/research.json":
    get:
      operationId: api_v1_academia_research
      summary: "Academia section: research."
      responses:
        "200":
          description: "Academia section: research."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AcademiaSection"
  "/api/v1/academia/{id}.json":
    get:
      operationId: academia_item
      summary: One academia row. The id is in academia.json.
      responses:
        "200":
          description: One academia row. The id is in academia.json.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AcademiaItem"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  "/api/v1/orgchart.json":
    get:
      operationId: api_v1_orgchart
      summary: "Published who's who: organisations, people, relations, regulation notes and caveats. A person named on a talk has talk_ids, event_ids and talks. affiliations lists the organisation the talk page stated for that talk, with the talk date when the page gave one, the source URL and the retrieval time. An affiliation the page did not state is omitted."
      responses:
        "200":
          description: "Published who's who: organisations, people, relations, regulation notes and caveats. A person named on a talk has talk_ids, event_ids and talks. affiliations lists the organisation the talk page stated for that talk, with the talk date when the page gave one, the source URL and the retrieval time. An affiliation the page did not state is omitted."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OrgChart"
  "/api/v1/orgchart/{id}.json":
    get:
      operationId: api_v1_orgchart_item
      summary: One item from /api/v1/orgchart.json
      responses:
        "200":
          description: One item from /api/v1/orgchart.json
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Document"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  "/api/v1/orgchart/relations.json":
    get:
      operationId: api_v1_orgchart_relations
      summary: "Relations between published who's who entries."
      responses:
        "200":
          description: "Relations between published who's who entries."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RelationList"
  "/api/v1/orgchart/regulation.json":
    get:
      operationId: api_v1_orgchart_regulation
      summary: "Short regulation status for each Nordic country, as on the who's who page."
      responses:
        "200":
          description: "Short regulation status for each Nordic country, as on the who's who page."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RegulationList"
  "/api/v1/orgchart/relations/{id}.json":
    get:
      operationId: orgchart_relation
      summary: "One relation from the who's who."
      responses:
        "200":
          description: "One relation from the who's who."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Relation"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  "/api/v1/profiles.json":
    get:
      operationId: api_v1_profiles
      summary: "Public profile links (Wikipedia, X, Wikidata and similar) for people and organisations."
      responses:
        "200":
          description: "Public profile links (Wikipedia, X, Wikidata and similar) for people and organisations."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ProfileList"
  "/api/v1/profiles/{id}.json":
    get:
      operationId: api_v1_profiles_item
      summary: One item from /api/v1/profiles.json
      responses:
        "200":
          description: One item from /api/v1/profiles.json
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Document"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  "/api/v1/images.json":
    get:
      operationId: api_v1_images
      summary: "Logos and photos used on the public who's who, with licence and credit. These are not newspaper photographs."
      responses:
        "200":
          description: "Logos and photos used on the public who's who, with licence and credit. These are not newspaper photographs."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ImageList"
  "/api/v1/illustrations.json":
    get:
      operationId: api_v1_illustrations
      summary: "Pictures used on story cards and story pages. Each record has source, author, license and url. No photograph from another newspaper is included. Outlet logos are in images.json and on each news item as source_logo."
      responses:
        "200":
          description: "Pictures used on story cards and story pages. Each record has source, author, license and url. No photograph from another newspaper is included. Outlet logos are in images.json and on each news item as source_logo."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/IllustrationList"
  "/api/v1/changelog.json":
    get:
      operationId: api_v1_changelog
      summary: "Site changelog (product changes, not the news), newest first."
      responses:
        "200":
          description: "Site changelog (product changes, not the news), newest first."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ChangelogList"
  "/api/v1/changelog/{id}.json":
    get:
      operationId: api_v1_changelog_item
      summary: One item from /api/v1/changelog.json
      responses:
        "200":
          description: One item from /api/v1/changelog.json
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Document"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  "/api/v1/rules.json":
    get:
      operationId: api_v1_rules
      summary: "How EU crypto rules become law in the five countries. Simplified, not legal advice. Omitted while the page is still a placeholder."
      responses:
        "200":
          description: "How EU crypto rules become law in the five countries. Simplified, not legal advice. Omitted while the page is still a placeholder."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Rules"
  "/api/v1/archive/articles.json":
    get:
      operationId: api_v1_archive_articles
      summary: Append-only archive of stories that have been on the public site. removed is  true when a story later left the site; the row stays.
      responses:
        "200":
          description: Append-only archive of stories that have been on the public site. removed is  true when a story later left the site; the row stays.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ArticleArchive"
  "/api/v1/archive/articles/{id}.json":
    get:
      operationId: api_v1_archive_articles_item
      summary: One item from /api/v1/archive/articles.json
      responses:
        "200":
          description: One item from /api/v1/archive/articles.json
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Document"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  "/api/v1/markets.json":
    get:
      operationId: markets
      summary: "Nordic exchange prices. Market data, not investment advice. Each ticker names the exchange, fetched_at, the source URL and volume when the exchange published it. NOK, SEK, DKK and EUR only. aggregated is one row per pair."
      responses:
        "200":
          description: "Nordic exchange prices. Market data, not investment advice. Each ticker names the exchange, fetched_at, the source URL and volume when the exchange published it. NOK, SEK, DKK and EUR only. aggregated is one row per pair."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MarketCatalogue"
  "/api/v1/markets/aggregated.json":
    get:
      operationId: markets_aggregated
      summary: "One price per base-quote pair. BTC-NOK is separate from BTC-EUR. last is the mean of published last prices. mid is the mean of bid/ask midpoints and is not blended into last. Volume is summed only within the same field and the same pair. logo_url is a CC0 icon when cryptocurrency-icons includes the asset, otherwise null."
      responses:
        "200":
          description: "One price per base-quote pair. BTC-NOK is separate from BTC-EUR. last is the mean of published last prices. mid is the mean of bid/ask midpoints and is not blended into last. Volume is summed only within the same field and the same pair. logo_url is a CC0 icon when cryptocurrency-icons includes the asset, otherwise null."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MarketAggregated"
  "/api/v1/markets/{exchange}.json":
    get:
      operationId: markets_exchange
      summary: "Prices from one included exchange: firi (Norway), nbx (Norway) or coinmotion (Finland)."
      responses:
        "200":
          description: "Prices from one included exchange: firi (Norway), nbx (Norway) or coinmotion (Finland)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MarketExchange"
      parameters:
        - name: exchange
          in: path
          required: true
          schema:
            type: string
  "/api/v1/markets/by-asset/{symbol}.json":
    get:
      operationId: markets_asset
      summary: "Prices for one asset (the base symbol, such as BTC) on every included Nordic exchange, plus aggregated pairs for each quote currency and logo_url when an icon is available."
      responses:
        "200":
          description: "Prices for one asset (the base symbol, such as BTC) on every included Nordic exchange, plus aggregated pairs for each quote currency and logo_url when an icon is available."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MarketAsset"
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
  "/api/v1/languages.json":
    get:
      operationId: api_v1_languages
      summary: "Site UI languages: code, native name, English name, rtl, html lang and home URL."
      responses:
        "200":
          description: "Site UI languages: code, native name, English name, rtl, html lang and home URL."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/LanguageList"
  "/api/v1/geo-language.json":
    get:
      operationId: api_v1_geo_language
      summary: Country to default site language. An IP guess only; the nc_lang cookie from the language switcher wins.
      responses:
        "200":
          description: Country to default site language. An IP guess only; the nc_lang cookie from the language switcher wins.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GeoLanguage"
  "/api/v1/meta.json":
    get:
      operationId: api_v1_meta
      summary: "Site name, languages, countries, page list, CORS, editorial notes and brand social accounts (social.telegram, social.x)."
      responses:
        "200":
          description: "Site name, languages, countries, page list, CORS, editorial notes and brand social accounts (social.telegram, social.x)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SiteMeta"
components:
  schemas:
    Document:
      type: object
      additionalProperties: true
    Discovery:
      type: object
      properties:
        api_version:
          type: string
        name:
          type: string
        generated_at:
          type: string
        preview:
          type: boolean
        endpoints:
          type: array
        counts:
          type: object
        cors:
          type: object
      description: Discovery
    NewsOutlet:
      type: object
      required:
        - url
        - primary
      properties:
        outlet:
          type: string
          description: Source id from sources.json.
        outlet_name:
          type: string
        url:
          type: string
        title:
          type: string
          description: "That outlet's headline."
        published:
          type: string
          description: ISO 8601 date-time with offset.
        lang:
          type: string
          description: "Language name, same vocabulary as language on the story."
        language_code:
          type: string
          nullable: true
        country:
          type: string
        source_type:
          type: string
          enum:
            - national
            - regional
            - official
            - international
          description: "national, regional (regional and local), official (justice and official), or international."
        paywall:
          type: boolean
        primary:
          type: boolean
        logo:
          type: object
          nullable: true
          description: "Outlet logo for this source id (via outlet / _source_alias in assets/img/logos/logos.json). Null when no checked image is on file; show the name only. Same fields as a who's who logo in images.json, plus raster_url."
          properties:
            kind:
              type: string
              enum:
                - logo
            file_url:
              type: string
              description: "The original file as fetched: SVG, or WebP for raster logos."
            raster_url:
              type: string
              nullable: true
              description: "PNG rendering of an SVG (256 px on the long side, transparent), or the WebP itself. Same value as logo_url."
            source_url:
              type: string
              nullable: true
              description: "Wikimedia Commons file page, or the image URL on the publisher's site."
            author:
              type: string
