name: Send a tip
description: Tip Nordic Crypto about an article on crypto, bitcoin or blockchain in Norway, Sweden, Denmark, Finland or Iceland.
title: "Tip: "
labels: ["tip"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the tip! Our editor checks every tip against [our rules](https://cryptonordic.no/tip/). A tip does not guarantee publication.

        **Privacy:** tips are **public** on GitHub, together with your GitHub username. Do not share personal or sensitive information (about yourself or anyone else) – just the link and, if you like, a short note.
  - type: input
    id: url
    attributes:
      label: Article URL
      description: Link to the original article (newspaper, broadcaster, regulator, central bank, company or similar).
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: country
    attributes:
      label: Country
      description: Which country is the story about?
      options:
        - Norway (NO)
        - Sweden (SE)
        - Denmark (DK)
        - Finland (FI)
        - Iceland (IS)
        - Not sure
    validations:
      required: false
  - type: textarea
    id: note
    attributes:
      label: Short note
      description: Optional. Why is it relevant? Please no personal or sensitive information.
    validations:
      required: false
  - type: input
    id: name
    attributes:
      label: Your name (optional)
      description: Optional. Leave empty to stay anonymous apart from your GitHub username. We do not publish it on the site.
    validations:
      required: false
  - type: checkboxes
    id: consent
    attributes:
      label: Privacy
      options:
        - label: I understand that this tip is public on GitHub and contains no personal or sensitive information.
          required: true
