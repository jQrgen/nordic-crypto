# Private Nordic Crypto tip intake (Cloudflare Worker + D1).
# Deploy steps and secrets: README.md. Do not put secrets in this file.
name = "nordic-crypto-tip-intake"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# No request logs. The Worker also never calls console.* .
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "nordic-crypto-tip-intake"
database_id = "00000000-0000-0000-0000-000000000000"   # replace after `wrangler d1 create`; not a tip, but account-specific
migrations_dir = "migrations"
