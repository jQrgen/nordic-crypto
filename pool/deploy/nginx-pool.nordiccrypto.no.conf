# Sample for pool.nordiccrypto.no.
# This file is included from the http {} context.
# Stratum is raw TCP on port 3333. Do not proxy it through nginx.
# Certificates are created on the server. They are not in this repository.

limit_req_zone $binary_remote_addr zone=poolapi:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name pool.nordiccrypto.no;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pool.nordiccrypto.no;

    ssl_certificate /etc/letsencrypt/live/pool.nordiccrypto.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pool.nordiccrypto.no/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /var/www/nexapool;
    index index.html;

    location /api/ {
        limit_req zone=poolapi burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
