# Nordic Crypto reader tip intake (Cloudflare Workers + D1). Deploy with ./deploy.sh (needs CLOUDFLARE_API_TOKEN).
name = "nordic-crypto-tips"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# No logs: Workers Logs / observability off, and the code never calls console.* with request data.
[observability]
enabled = false

# Shoutbox secrets are not in this file and are not set by deploy.sh.
#   wrangler secret put TURNSTILE_SECRET
#   wrangler secret put SHOUT_ADMIN_TOKEN
# Private tip inbox (TURNSTILE_SECRET above is shared):
#   wrangler secret put PRIVATE_TIPS_READ_TOKEN     (newsroom read API, give it out of band)
#   wrangler secret put TIP_WEBHOOK_URL / TIP_WEBHOOK_BEARER   (optional, https only)
#   wrangler secret put ONION_INGEST_TOKEN          (Tor forwarder in onion/; must differ from the read token)

# Admin page (/admin/, src/admin.js): ADMIN_EMAIL_DOMAIN below; optional secret for send_issue.py --from-json:
#   wrangler secret put ADMIN_DELIVERY_TOKEN        (>= 32 chars; only needed for POST /api/admin/deliveries)
# Newsletter mail ON (jQrgen, 2026-10-16). Sender MAIL_FROM_NORDIC_CRYPTO is a wrangler secret.
[vars]
MAIL_PROVIDER = "resend"
MAIL_SEND_ENABLED = "1"
COLUMNIST_TO = "jqrgen@nordiccrypto.no"   # private columnist applications are forwarded here (Reply-To = applicant)
ADMIN_EMAIL_DOMAIN = "nordiccrypto.no"   # any address at exactly this domain may get an admin sign-in link

[[d1_databases]]
binding = "DB"
database_name = "nordic-crypto-tips"
database_id = "00000000-0000-0000-0000-000000000000"   # replaced by deploy.sh with the real id
migrations_dir = "migrations"
