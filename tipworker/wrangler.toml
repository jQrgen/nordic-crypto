# Crypto Nordic reader tip intake (Cloudflare Workers + D1). Deploy with ./deploy.sh (needs CLOUDFLARE_API_TOKEN).
name = "nordic-crypto-tips"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# No logs: Workers Logs / observability off, and the code never calls console.* with request data.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "nordic-crypto-tips"
database_id = "00000000-0000-0000-0000-000000000000"   # replaced by deploy.sh with the real id
migrations_dir = "migrations"
