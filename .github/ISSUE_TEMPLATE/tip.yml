name: Send a tip (retired)
description: Do not send tips here. Tips are not accepted as public GitHub issues.
title: "Do not use: tips are private"
labels: ["tip"]
body:
  - type: markdown
    attributes:
      value: |
        This public form is retired. Do not send a tip, a name, a contact detail, or anything you do not want public.

        Tips are not accepted here. The private inbox on the website is not open yet: https://nordiccrypto.no/tip/

        Nothing you type in a GitHub issue is private.
  - type: checkboxes
    id: understood
    attributes:
      label: Confirm
      options:
        - label: I understand this GitHub form is retired and I should not submit a tip here.
          required: true
